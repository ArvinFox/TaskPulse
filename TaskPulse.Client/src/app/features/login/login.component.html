<div class="login-container">
  <div class="login-card glass-panel">
    <div class="login-header">
      <div class="logo-box">T</div>
      <h2>Welcome to TaskPulse</h2>
      <p class="subtitle">Please sign in to access your workspace</p>
    </div>

    <!-- Error Alert block -->
    <div *ngIf="errorMessage()" class="error-alert">
      {{ errorMessage() }}
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" 
               type="text" 
               [(ngModel)]="username" 
               name="username" 
               placeholder="admin" 
               class="input-field"
               required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" 
               type="password" 
               [(ngModel)]="password" 
               name="password" 
               placeholder="admin123" 
               class="input-field"
               required>
      </div>

      <button type="submit" 
              [disabled]="isLoading()" 
              class="btn-primary login-btn">
        <span *ngIf="!isLoading()">Sign In</span>
        <span *ngIf="isLoading()">Authenticating...</span>
      </button>
    </form>
    
    <div class="login-tips">
      <p>💡 Tip: Use the default credentials <b>admin</b> / <b>admin123</b> to log in.</p>
    </div>
  </div>
</div>
